name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  go-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: services/worker-engine/go.sum
      - run: go vet ./...
        working-directory: services/worker-engine
      - run: go test ./...
        working-directory: services/worker-engine

  control-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw -B -q test
        working-directory: services/control-plane

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm test
        working-directory: web

  e2e-mock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: ./scripts/verify_e2e.ps1 -MockMode

  live-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [go-worker, control-plane, dashboard]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build and start stack
        run: docker compose -f docker/docker-compose.yml up -d --build
      - name: Verify real HTTP, WebSocket, checksum, and TTL flow
        run: node scripts/verify_live.mjs
      - name: Capture stack logs
        if: failure()
        run: docker compose -f docker/docker-compose.yml logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v
