name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: coldharbour
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: coldharbour
        ports:
          - 5432:5432
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - run: go run ./cmd/coldharbour migrate
        env:
          POSTGRES_DSN: postgres://coldharbour:ci@127.0.0.1:5432/coldharbour?sslmode=disable
      - run: COLDHARBOUR_INTEGRATION=1 go test ./...
        env:
          POSTGRES_DSN: postgres://coldharbour:ci@127.0.0.1:5432/coldharbour?sslmode=disable
      - run: go run ./cmd/sentinel-load
      - run: WRITE_PROFILE=1 go run ./cmd/sentinel-load
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sentinel-load-profiles
          path: bench/*.pprof
          if-no-files-found: ignore
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci && npm run build
        working-directory: dashboard
      - uses: securego/gosec@v2.29.0
        with:
          args: ./...
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          exit-code: "1"
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - run: bash scripts/gen-certs.sh
      - name: Start the Compose stack
        run: |
          mkdir -p /tmp/signkey
          cat > /tmp/signkey/main.go <<'EOF'
          package main

          import (
            "crypto/ed25519"
            "crypto/rand"
            "encoding/base64"
            "fmt"
          )

          func main() {
            _, priv, err := ed25519.GenerateKey(rand.Reader)
            if err != nil {
              panic(err)
            }
            fmt.Print(base64.StdEncoding.EncodeToString(priv))
          }
          EOF
          key=$(cd /tmp/signkey && go mod init signkey >/dev/null && go run .)
          export SIGNING_KEY="$key"
          export POSTGRES_PASSWORD=ci-postgres
          export REDIS_PASSWORD=ci-redis
          docker compose up -d --build
          ready=0
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -H "X-API-Key: ch_live_a_demo_key_aaaaaaaa" http://127.0.0.1:8081/v1/jobs || true)
            if [ "$code" = "200" ] || [ "$code" = "401" ]; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            docker compose logs
            exit 1
          fi
          export POSTGRES_DSN="postgres://coldharbour:${POSTGRES_PASSWORD}@127.0.0.1:5433/coldharbour?sslmode=verify-full&sslrootcert=docker/certs/ca.crt"
          echo "API_KEY_A=$(go run ./cmd/coldharbour admin create-tenant --name tenant-a)" >> "$GITHUB_ENV"
          echo "API_KEY_B=$(go run ./cmd/coldharbour admin create-tenant --name tenant-b)" >> "$GITHUB_ENV"
      - name: Contract tests
        run: |
          API_BASE=http://127.0.0.1:8081 API_PREFIX=/v1 COLDHARBOUR_WORKER_CONTAINER=coldharbour-worker go test ./internal/apitest -count=1 -timeout 180s
          export POSTGRES_DSN="postgres://coldharbour:ci-postgres@127.0.0.1:5433/coldharbour?sslmode=verify-full&sslrootcert=docker/certs/ca.crt"
          ids=$(docker exec coldharbour-m7-postgres psql -U coldharbour -d coldharbour -tA -c "SELECT id FROM tenants")
          for id in $ids; do
            go run ./cmd/verify ledger --tenant "$id"
          done
