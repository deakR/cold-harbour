services:
  postgres:
    image: postgres:16
    container_name: coldharbour-m7-postgres
    environment:
      POSTGRES_USER: coldharbour
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: coldharbour
    volumes:
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./docker/certs:/certs:ro
      - ./docker/pg_hba.conf:/pg_hba.conf:ro
    entrypoint: ["bash", "-c"]
    command:
      - |
        cp /certs/server.key /tmp/server.key
        cp /certs/server.crt /tmp/server.crt
        chmod 600 /tmp/server.key
        chown postgres:postgres /tmp/server.key /tmp/server.crt
        exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/tmp/server.crt -c ssl_key_file=/tmp/server.key -c hba_file=/pg_hba.conf
    ports:
      - "5433:5432"
  redis:
    image: redis:7
    container_name: coldharbour-m5-redis
    command:
      - redis-server
      - --port
      - "0"
      - --tls-port
      - "6379"
      - --tls-cert-file
      - /certs/server.crt
      - --tls-key-file
      - /certs/server.key
      - --tls-ca-cert-file
      - /certs/ca.crt
      - --tls-auth-clients
      - "no"
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    ports:
      - "6380:6379"
    volumes:
      - ./docker/certs:/certs:ro
  vault:
    image: hashicorp/vault:1.18
    container_name: coldharbour-vault
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: coldharbour-dev
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    command: ["server", "-dev"]
    ports:
      - "8200:8200"
  vault-init:
    image: hashicorp/vault:1.18
    depends_on:
      - vault
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: coldharbour-dev
    entrypoint: ["sh", "-c", "until vault status >/dev/null 2>&1; do sleep 1; done; vault secrets enable transit || true; vault write -f transit/keys/coldharbour"]
    restart: "no"
  seed:
    profiles: ["dev"]
    image: postgres:16
    depends_on:
      - postgres
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - ./dev/seed.sql:/seed.sql:ro
    entrypoint: ["bash", "-c", "until pg_isready -h postgres -U coldharbour; do sleep 1; done; psql -h postgres -U coldharbour -d coldharbour -f /seed.sql"]
  worker:
    container_name: coldharbour-worker
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.worker
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      vault-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_DSN: "postgres://coldharbour:${POSTGRES_PASSWORD}@postgres:5432/coldharbour?sslmode=verify-full&sslrootcert=/certs/ca.crt"
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_TLS: "1"
      REDIS_CA: /certs/ca.crt
      SIGNING_KEY: ${SIGNING_KEY:?set SIGNING_KEY}
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: coldharbour-dev
    expose:
      - "9100"
    volumes:
      - ./docker/certs:/certs:ro
  controlplane:
    container_name: coldharbour-controlplane
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.controlplane
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      vault-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_DSN: "postgres://coldharbour:${POSTGRES_PASSWORD}@postgres:5432/coldharbour?sslmode=verify-full&sslrootcert=/certs/ca.crt"
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_TLS: "1"
      REDIS_CA: /certs/ca.crt
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: coldharbour-dev
    ports:
      - "8081:8080"
    volumes:
      - ./docker/certs:/certs:ro
