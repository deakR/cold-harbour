services:
  redis:
    image: redis:7.2-alpine
    container_name: coldharbor-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: coldharbor-postgres
    restart: unless-stopped
    ports:
      # Host postgres occupies 5432 on dev machines; remapped to avoid conflict.
      - "5433:5432"
    environment:
      POSTGRES_DB: coldharbor
      POSTGRES_USER: coldharbor
      POSTGRES_PASSWORD: coldharbor_secret
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coldharbor -d coldharbor"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
    name: coldharbor_redis_data
  pg_data:
    name: coldharbor_pg_data
